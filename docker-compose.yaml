services:
  postgres:
    image: 'postgres:16'
    container_name: 'foodDeliveryPostgres'
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=12345'
    ports:
      - '5432:5432'
    networks:
      - food-network
  project:
    build: .
    container_name: foodDelivery
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://foodDeliveryPostgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
      - MANAGEMENT_METRICS_TAGS_APPLICATION=food-delivery
      - MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED=true
    depends_on:
      - postgres
    networks:
      - food-network
  prometheus:
    image: prom/prometheus:v2.51.2

    container_name: foodPrometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - project

    networks:
      - food-network

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: foodGrafana
    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    depends_on:
      - prometheus

    networks:
      - food-network
  loki:
    image: grafana/loki:2.9.4
    container_name: foodLoki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
      - loki-wal:/wal  # Добавляем отдельный volume для WAL
    user: "10001:10001"  # Запускаем от пользователя loki
    networks:
      - food-network

  alloy:
    image: grafana/alloy:latest
    container_name: foodAlloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
    networks:
      - food-network
networks:
  food-network:
    driver: bridge
volumes:
  loki-data:
  loki-wal: